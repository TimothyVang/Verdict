name: Eval Hallucination Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  hallucination-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Verify evaluator and scorer files exist
        run: |
          for task in inspect_ai/tasks/verdict_eval_cloud.py inspect_ai/tasks/verdict_eval_airgap.py inspect_ai/tasks/verdict_eval_dual.py; do
            if [ ! -f "$task" ]; then
              echo "::error::scorer_not_implemented: $task is missing"
              exit 1
            fi
          done
          if [ ! -f inspect_ai/scorers/hallucination_rate.py ]; then
            echo "::error::scorer_not_implemented: inspect_ai/scorers/hallucination_rate.py is missing"
            exit 1
          fi

      - name: Verify cloud evaluator prerequisites
        run: uv run verdict doctor --mode cloud

      - name: Run hallucination scorer
        run: uv run inspect eval inspect_ai/tasks/verdict_eval_cloud.py --score hallucination_rate

      - name: Verify air-gap evaluator prerequisites
        run: uv run verdict doctor --mode airgap

      - name: Run air-gap hallucination scorer
        run: uv run inspect eval inspect_ai/tasks/verdict_eval_airgap.py --score hallucination_rate

      - name: Verify dual evaluator prerequisites
        run: uv run verdict doctor --mode dual

      - name: Run dual hallucination scorer
        run: uv run inspect eval inspect_ai/tasks/verdict_eval_dual.py --score hallucination_rate
