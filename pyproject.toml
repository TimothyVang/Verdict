[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdict"
version = "0.1.0"
description = "Autonomous Windows DFIR agent — SANS FIND EVIL! 2026 hackathon entry"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "blake3>=1.0,<2",
    "typer>=0.9,<1",
    "python-ulid>=2.0,<3",
]

[project.scripts]
verdict = "verdict.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: smoke tests (may require live services)",
    "integration: integration tests against real services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "TID"]
ignore = ["B008", "N818"]
