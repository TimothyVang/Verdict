[project]
name = "verdict"
version = "0.1.0"
description = "VERDICT — autonomous Windows DFIR agent for SANS FIND EVIL! 2026"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "VERDICT contributors" },
]

dependencies = [
    # LangGraph orchestration (MIT)
    "langgraph>=0.2.50,<0.3",
    # Pydantic v2 schemas (MIT)
    "pydantic>=2.7,<3",
    # blake3 hashing (CC0/Apache-2.0)
    "blake3>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdict"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["protocol-sift", "downloads", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: line length handled by formatter.
# UP042: ARCHITECTURE.md uses `class Mode(str, Enum)` style for JSON
# round-tripping; StrEnum has subtly different __format__ semantics that
# would change ledger payloads. Keep the explicit (str, Enum) pattern.
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
