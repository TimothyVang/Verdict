[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "verdict"
version = "0.1.0"
description = "VERDICT - autonomous Windows DFIR / incident-response agent (SANS FIND EVIL! 2026)"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Verdict contributors" }]
readme = "README.md"
dependencies = [
    "anthropic>=0.97,<1",
    "blake3>=1.0,<2",
    "claude-agent-sdk>=0.1.72",
    "fastmcp>=3,<4",
    "inspect-ai>=0.3,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0",
]

[project.scripts]
verdict = "verdict.cli.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1,<2",
    "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
markers = [
    "smoke: integration smoke tests that may require external binaries or services",
    "chaos: kill-9-resume + power-loss tests (W3.E.3)",
    "e2e: full Inspect AI ground-truth runs (W4 / W5)",
]
filterwarnings = [
    "error",
    "default::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "E501", "INP001", "PLR2004", "S101", "SIM108"]

[tool.hatch.build.targets.wheel]
packages = ["scripts", "src/verdict"]

[dependency-groups]
dev = [
    "commitizen>=4.10.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
