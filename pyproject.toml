[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdict"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "blake3>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: smoke tests that cross system boundaries (may xfail on missing services)",
]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
